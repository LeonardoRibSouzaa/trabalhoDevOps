name: Trabalo de DevOps

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-react:
    name: Validar aplicação React
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de procução
        run: npm run build

      - name: Salvar build gerado
        uses: actions/upload-artifact@v4
        with:
          name: build-react
          path: dist/
